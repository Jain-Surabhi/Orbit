<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit — a friendly AI chatbot</title>
  <meta name="description" content="Orbit is a general-purpose AI chatbot. Ask anything, write, brainstorm and learn.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/robot.png" type="image/png">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem('orbit-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#composer-input">Skip to message box</a>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Orbit</h1>
        <span class="label">general-purpose AI chat</span>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="new-chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>New chat</span>
        </button>
        <button type="button" class="btn icon" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme" title="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="scene" aria-label="Orbit the robot">
        <div class="stage">
          <img class="robot" src="assets/robot.png" width="701" height="900" alt="Orbit, a cheerful pixel-art robot with a glowing antenna, waving hello">
          <div class="bubble-wrap">
            <p class="speech">Hey, I’m Orbit. What’s on your mind?</p>
          </div>
        </div>
        <p class="label scene-note">pixel pal · online</p>
      </section>

      <section class="chat" aria-label="Chat with Orbit">
        <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Conversation">
          <div class="welcome" id="welcome">
            <p class="label">try asking</p>
            <h2>Ask me anything.</h2>
            <p class="lede">Questions, drafts, ideas, explanations — and follow-ups too.</p>
            <ul class="chips" id="chips">
              <li><button type="button" class="chip">Explain how black holes work in simple terms</button></li>
              <li><button type="button" class="chip">Brainstorm 5 names for a small bakery</button></li>
              <li><button type="button" class="chip">Write a friendly email asking to reschedule a meeting</button></li>
              <li><button type="button" class="chip">Give me a 3-day plan to learn the basics of Python</button></li>
            </ul>
          </div>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <label class="sr" for="composer-input">Message Orbit</label>
          <textarea id="composer-input" rows="1" maxlength="2000" placeholder="Message Orbit…" enterkeyhint="send"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <p class="hint label" id="hint"><span class="kbd-hint">Enter to send · Shift+Enter for a new line</span><span id="count" aria-live="off"></span></p>
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
